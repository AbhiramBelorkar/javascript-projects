<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <textarea id="textInput" rows="5" placeholder="Type here..." maxlength="100"></textarea>
    <div class="counter">
      Characters limit: <span id="charCount">0</span>
      <!-- Optional: <span id="charLimit">/ 100</span> -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
