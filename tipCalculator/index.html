<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tip Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Tip Calculator</h1>
    <form id="tipForm">
      <div class="form-group">
        <label for="billAmount">Bill Amount ($):</label>
        <input type="number" id="billAmount" placeholder="Enter bill amount" required>
      </div>
      <div class="form-group">
        <label for="tipPercentage">Tip Percentage (%):</label>
        <input type="number" id="tipPercentage" placeholder="Enter tip percentage" required>
      </div>
      <button type="submit">Calculate Tip</button>
    </form>

    <div class="result">
      <p>Tip Amount: $<span id="tipAmount">0.00</span></p>
      <p>Total Amount: $<span id="totalAmount">0.00</span></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
