<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="quiz-container">
    <h1>Quiz App</h1>
    <form id="quizForm">
      <div class="question">
        <p>1. What is the capital of France?</p>
        <label><input type="radio" name="q1" value="a"> London</label><br>
        <label><input type="radio" name="q1" value="b"> Paris</label><br>
        <label><input type="radio" name="q1" value="c"> Rome</label>
      </div>

      <div class="question">
        <p>2. Which is the largest planet in our solar system?</p>
        <label><input type="radio" name="q2" value="a"> Earth</label><br>
        <label><input type="radio" name="q2" value="b"> Jupiter</label><br>
        <label><input type="radio" name="q2" value="c"> Mars</label>
      </div>

      <div class="question">
        <p>3. What is the boiling point of water?</p>
        <label><input type="radio" name="q3" value="a"> 100°C</label><br>
        <label><input type="radio" name="q3" value="b"> 0°C</label><br>
        <label><input type="radio" name="q3" value="c"> 50°C</label>
      </div>

      <button type="submit">Submit</button>
    </form>

    <div id="result"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
